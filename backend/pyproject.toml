[project]
name = "quotient-api"
version = "1.0.0"
description = "Quotes, invoices and payments for independent studios."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
    "S101",  # asserts are fine in tests
    "B008",  # FastAPI dependencies are callables in defaults
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/config.py" = ["S105"]
"app/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
